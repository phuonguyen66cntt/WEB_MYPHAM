<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Basic Icons -->
    <!-- Basic Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <!-- Filled Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <!-- Brand Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../css/matkhau.css">
</head>
<body>
    <!-- Đặt lại mật khẩu 1 -->
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="../img/logo1.jpg" alt="logo">
            </div>
            <h2>Đặt lại mật khẩu</h2>
        </header>

        <main class="main">
            <div class="reset-box" id="resetBox">
                <h2>Đặt lại mật khẩu</h2>
                <form id="resetForm">
                    <input type="text"  placeholder="Số điện thoại/Email">
                    <div id="error-message" style="color: red; font-size: 18px; margin-top: 10px; font-weight: 500;"></div>
                    <button type="submit" class="btn-next">Tiếp theo</button>
                </form>
            </div>

           
        </main>

        <footer class="footer">
            <div class="footer-container">
                <!-- LOGO -->
                <div class="footer-col footer-logo">
                    <img src="../img/logo1.jpg" alt="logo">
                </div>
                <!-- GIỚI THIỆU -->
                <div class="footer-col">
                    <h4>Giới thiệu</h4>
                    <ul>
                        <li>Về L.U.V</li>
                        <li>Chính sách bảo mật</li>
                        <li>Điều khoản dịch vụ</li>
                        <li>Hướng dẫn mua hàng</li>
                    </ul>
                </div>
                <!-- LIÊN HỆ -->
                <div class="footer-col">
                    <h4>Liên hệ</h4>
                    <ul>
                        <li>123 Đường ABC, Khánh Hòa</li>
                        <li>0123 456 789</li>
                        <li>info@luv.com</li>
                    </ul>
                </div>
                <!-- MẠNG XÃ HỘI -->
                <div class="footer-col">
                    <h4>Theo dõi chúng tôi</h4>
                    <div class="social-list">
                        <a href="#">
                        <i class="fa fa-facebook"></i>
                        </a>
                        <a href="#">
                       <i class="fa fa-instagram"></i>
                        </a>
                        <a href="#">
                       <i class="fa fa-google"></i>
                        </a>
                    </div>
                </div>
            </div>
        </footer>
    </div>


    <script>
        const resetBox = document.getElementById('resetBox');

        // ĐẶT LẠI MẬT KHẨU
        function handleResetForm() {
            const form = document.getElementById('resetForm');
            if (!form) return;

            const input = form.querySelector('input');
            const errorDiv = document.getElementById('error-message');

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const value = input.value.trim();

                //Kiểm tra nếu ô nhập liệu rỗng
                if (!value) {
                    errorDiv.textContent = "Vui lòng nhập Số điện thoại hoặc Email!";
                    input.style.border = "2px solid red";
                    return;
                }

                //Xóa thông báo lỗi và viền đỏ
                errorDiv.textContent = "";
                input.style.border = "1px solid #ccc";

                //Kiểm tra điều kiện số điện thoại
                if (!isNaN(value)) {
                    if (value.length < 10 || value.length > 11) {
                        errorDiv.textContent = "Số điện thoại phải 10 chữ số!";
                        return;
                    }
                }

                //Chuyển sang giao diện OTP
                showOTPView();
            });
        }

        //GIAO DIỆN NHẬP OTP
        function showOTPView() {
            resetBox.innerHTML = `
                <h2>Đặt lại mật khẩu</h2>
                <p class="otp-message">Mã OTP đã được gửi đến, vui lòng kiểm tra tin nhắn và nhập mã</p>
                <form id="otpForm">
                    <input type="text" placeholder="Nhập mã OTP" id="otpInput">
                    <div id="otp-error" style="color: red; font-size: 18px; margin-top: 10px; font-weight: 500;"></div>
                    <button type="submit" class="btn-confirm">Xác nhận</button>
                </form>
                <button type="button" class="btn-back" id="btnBackToStep1">
                    <i class="fa fa-arrow-left"></i> Quay lại
                </button>
            `;
            handleOTPForm();
        }

        //Hàm xử lý form OTP
        function handleOTPForm() {
            const form = document.getElementById('otpForm');
            if (!form) return;

            const input = document.getElementById('otpInput');
            const errorDiv = document.getElementById('otp-error');

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const value = input.value.trim();

                //Kiểm tra mã OTP (giả sử mã hợp lệ là 6 chữ số)
                if (!value) {
                    errorDiv.textContent = "Vui lòng nhập mã OTP!";
                    input.style.border = "2px solid red";
                    return;
                }

                if (value.length !== 6) {
                    errorDiv.textContent = "Mã OTP phải có 6 chữ số!";
                    return;
                }

                //Xóa lỗi và chuyển sang giao diện nhập mật khẩu mới
                errorDiv.textContent = "";
                input.style.border = "1px solid #ccc";
                showNewPasswordView();
            });
        }

        //GIAO DIỆN NHẬP MẬT KHẨU MỚI
        function showNewPasswordView() {
            resetBox.innerHTML = `
                <h2>Đặt lại mật khẩu</h2>
                <p class="otp-message">Nhập mật khẩu mới của bạn</p>
                <form id="newPasswordForm">
                    <input class="new-pw" type="password" placeholder="Nhập mật khẩu mới" id="newPassword">
                    <input type="password" placeholder="Nhập lại mật khẩu mới" id="confirmPassword">
                    <div id="password-error" style="color: red; font-size: 18px; margin-top: 10px; font-weight: 500;"></div>
                    <button type="submit" class="btn-confirm">Xác nhận</button>
                </form>
                <button type="button" class="btn-back" id="btnBackToStep2">
                    <i class="fa fa-arrow-left"></i> Quay lại
                </button>
            `;
            handleNewPasswordForm();
        }

        // Hàm xử lý form mật khẩu mới 
        function handleNewPasswordForm() {
            const form = document.getElementById('newPasswordForm');
            if (!form) return;

            const newPassword = document.getElementById('newPassword');
            const confirmPassword = document.getElementById('confirmPassword');
            const errorDiv = document.getElementById('password-error');

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const pass1 = newPassword.value.trim();
                const pass2 = confirmPassword.value.trim();

                //Kiểm tra các trường nhập liệu
                if (!pass1 || !pass2) {
                    errorDiv.textContent = "Vui lòng nhập đầy đủ thông tin!";
                    newPassword.style.border = pass1 ? "1px solid #ccc" : "2px solid red";
                    confirmPassword.style.border = pass2 ? "1px solid #ccc" : "2px solid red";
                    return;
                }

                //Kiểm tra độ dài mật khẩu
                if (pass1.length < 6) {
                    errorDiv.textContent = "Mật khẩu phải có ít nhất 6 ký tự!";
                    return;
                }

                //Kiểm tra hai mật khẩu khớp nhau
                if (pass1 !== pass2) {
                    errorDiv.textContent = "Mật khẩu không khớp!";
                    confirmPassword.style.border = "2px solid red";
                    return;
                }

                //Xóa lỗi
                errorDiv.textContent = "";
                newPassword.style.border = "1px solid #ccc";
                confirmPassword.style.border = "1px solid #ccc";

                //Thông báo thành công (hoặc gửi dữ liệu lên server)
                alert("Đặt lại mật khẩu thành công!");
            });
        }

        //Xử lý sự kiện click nút quay lại (dùng event delegation) 
        document.addEventListener('click', function(e) {
            // Quay về bước 1
            if (e.target.closest('#btnBackToStep1')) {
                resetBox.innerHTML = `
                    <h2>Đặt lại mật khẩu</h2>
                    <form id="resetForm">
                        <input type="text" placeholder="Số điện thoại/Email">
                        <div id="error-message" style="color: red; font-size: 18px; margin-top: 10px; font-weight: 500;"></div>
                        <button type="submit" class="btn-next">Tiếp theo</button>
                    </form>
                `;
                handleResetForm();
            }

            //Quay về giao diện nhập mã OTP
            if (e.target.closest('#btnBackToStep2')) {
                resetBox.innerHTML = `
                    <h2>Đặt lại mật khẩu</h2>
                    <p class="otp-message">Mã OTP đã được gửi đến, vui lòng kiểm tra tin nhắn và nhập mã</p>
                    <form id="otpForm">
                        <input type="text" placeholder="Nhập mã OTP" id="otpInput">
                        <div id="otp-error" style="color: red; font-size: 18px; margin-top: 10px; font-weight: 500;"></div>
                        <button type="submit" class="btn-confirm">Xác nhận</button>
                    </form>
                    <button type="button" class="btn-back" id="btnBackToStep1">
                        <i class="fa fa-arrow-left"></i> Quay lại
                    </button>
                `;
                handleOTPForm();
            }
        });

        //Khởi chạy lần đầu
        handleResetForm();
    </script>


</body>
</html>
